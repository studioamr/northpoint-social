name: tokens
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: tokens, cancel-in-progress: true}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/tokens.py
      - run: |
          git config user.name "northpoint-bot"
          git config user.email "actions@github.com"
          git add data/tokens.json
          git diff --cached --quiet || (git commit -m "tokens: actualizar caché" && git pull --rebase -q && git push)
