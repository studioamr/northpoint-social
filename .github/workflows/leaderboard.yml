name: clasificacion
on:
  schedule: [{cron: "17 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/leaderboard.py
      - run: |
          git config user.name "northpoint-bot"
          git config user.email "actions@github.com"
          git add data/leaderboard.json
          git diff --cached --quiet || (git commit -m "clasificación: actualizar" && git push)
